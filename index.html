function starMark(){

function activityState(i){
 if(!progress.has(i))progress.set(i,{presses:0,input:'',choice:null,correct:false,message:''});
 return progress.get(i);

function printSurface(t,presses){
 const total=t.stamp==='single'?presses:6*presses;
 if(t.stamp==='umbrella'){
  const marks=[[99,63],[142,44],[181,41],[212,68],[150,78],[112,92]];
  const stars=presses?marks.map(([x,y])=>'<path class="printed-star" transform="translate('+x+' '+y+') scale(.64)" d="'+starPath+'" fill="#ffdd88"/>').join(''):'';
  return '<svg class="umbrella" viewBox="0 0 300 135" role="img" aria-label="داخل المظلّة، هلال و'+arab(total)+' نجمات"><path d="M19 104Q46 16 150 10q105 6 132 94-20-9-36 6-23-12-47 4-26-13-49 5-25-18-50-5-22-16-46-4-17-15-35-6Z" fill="#425589" stroke="#273655" stroke-width="2.5"/><path d="M69 67a13 13 0 1 0 13 16q-16 5-13-16Z" fill="#ffdb84"/>'+stars+'</svg>';
 }
 return '<div class="print-card" role="img" aria-label="ورقة عليها '+arab(total)+' من النجوم">'+(total?Array.from({length:total},starMark).join(''):'<span class="blank">ورقة الطباعة</span>')+'</div>';
}
function boardContents(i){
 const t=spreads[i].task,st=activityState(i),done=st.presses>=t.limit;
 const wait=t.stamp==='batch'&&!st.correct;
 const label=done?'اكتملت الطباعة':wait?'اختر الإجابة أوّلًا':t.stamp==='single'?'اطبع نجمة':'اطبع النجوم معًا';
 return printSurface(t,st.presses)+'<div class="stamp-controls"><button type="button" class="stamp-btn" data-stamp '+((done||wait)?'disabled':'')+'>'+label+'</button><span class="press-count" role="status">الطَّبعات <b>'+arab(st.presses)+' / '+arab(t.limit)+'</b></span></div>';
}
function stampBoard(i){
 return '<div class="stamp-board" aria-label="بطاقة الطباعة">'+boardContents(i)+'</div>';
}
function questionBox(i){
 const t=spreads[i].task;
 let controls='';
 if(t.mode==='type')controls='<form class="answer-form" novalidate><input type="text" inputmode="numeric" maxlength="12" aria-label="عدد النجوم" autocomplete="off" placeholder="اكتب العدد"><button type="submit" class="check-answer">تحقّق</button></form>';
 if(t.mode==='choice')controls='<div class="options">'+t.options.map(v=>'<button type="button" class="option" data-choice="'+v+'">'+arab(v)+'</button>').join('')+'</div>';
 return '<section class="activity"><h3>'+t.prompt+'</h3>'+controls+'<div class="feedback" aria-live="polite" aria-atomic="true"></div><button type="button" class="again" data-retry hidden>أجرّب من جديد</button></section>';
}
function refreshActivity(i,renderBoard=false,focusOn=''){
 const t=spreads[i].task,st=activityState(i),area=book.querySelector('.activity');
 if(!area)return;
 const input=area.querySelector('input');
 if(input){if(input.value!==st.input)input.value=st.input;input.readOnly=st.correct;area.querySelector('.check-answer').disabled=st.correct;}
 area.querySelectorAll('[data-choice]').forEach(b=>{
  const picked=Number(b.dataset.choice)===st.choice;
  b.classList.toggle('good',picked&&st.correct);b.classList.toggle('wrong',picked&&!st.correct);
  b.setAttribute('aria-pressed',String(picked));b.disabled=st.correct;
 });
 const fb=area.querySelector('.feedback');fb.classList.toggle('positive',st.correct);fb.textContent=st.message;
 if(st.correct&&t.equation){
  const div=document.createElement('div');div.className='eqs';div.innerHTML=eq(...t.equation);fb.append(div);
 }
 area.querySelector('.again').hidden=!st.correct;
 if(t.stamp&&renderBoard){
  const box=book.querySelector('.stamp-board');if(box)box.innerHTML=boardContents(i);
 }
 if(focusOn){
  const target=book.querySelector(focusOn);
  if(target&&!target.disabled){
   target.focus({preventScroll:true});
   if(compact)target.scrollIntoView?.({block:'nearest',behavior:reduceMotion.matches?'instant':'smooth'});
  }
 }
 fitPaper();
}
function numericInput(value){
 const s=value.trim().replace(/[٠-٩]/g,c=>String(c.charCodeAt(0)-1632)).replace(/[۰-۹]/g,c=>String(c.charCodeAt(0)-1776));
 return /^\d+$/.test(s)?Number(s):null;
}
function submitAnswer(i,v){
 const st=activityState(i),t=spreads[i].task;
 if(st.correct)return;
 if(t.stamp==='single'&&st.presses<t.limit){st.message='أكمل الطبعات الستّ على الورقة أولًا، ثم تحقّق من عدد النجوم.';refreshActivity(i,false,'[data-stamp]');return;}
 st.correct=v===t.answer;
 st.message=st.correct?t.correct:v===null?'اكتب عددًا، ثم اضغط «تحقّق».':'جرّب مرّةً أخرى. '+t.hint;
 if(st.correct&&t.stamp==='batch')st.message+=' جرّب الخَتْم الآن.';
 refreshActivity(i,true,st.correct&&t.stamp==='batch'?'[data-stamp]':'');
}
function pressStamp(i){
 const st=activityState(i),t=spreads[i].task;
 if(st.presses>=t.limit||(t.stamp==='batch'&&!st.correct))return;
 st.presses++;
 if(t.mode==='print'){st.correct=true;st.message=t.correct;}
 else if(t.stamp==='single')st.message=st.presses===t.limit?'اكتملت الطبعات. اكتب الآن عدد النجوم.':'';
 else st.message='ها هي النجمات الستّ على الورقة، بطبعة واحدة!';
 const nextFocus=st.presses<t.limit?'[data-stamp]':t.mode==='type'?'.answer-form input':'[data-retry]';
 refreshActivity(i,true,nextFocus);
}
function labContents(){
 const n=sampleCount,groups=batchMode?1:n,size=batchMode?n:1;
 const btn=(mode,label)=>'<button type="button" data-mode="'+mode+'" aria-pressed="'+(batchMode===(mode==='batch'))+'">'+label+'</button>';
 const group='<span class="print-group">'+(size?Array.from({length:size},starMark).join(''):'<span class="blank">طبعة فارغة</span>')+'</span>';
 const prints=Array.from({length:groups},()=>group).join('')||'<span class="blank">لم نطبع أيَّ طبعة.</span>';
 return '<div class="lab-modes" role="group" aria-label="نوع الختم">'+btn('single','نجمة في كلّ طبعة')+btn('batch','العدد كلّه في طبعة')+'</div><div class="lab-controls"><button type="button" data-adjust="1" aria-label="زد العدد" '+(n===10?'disabled':'')+'>+</button><span>العدد <b>'+arab(n)+'</b></span><button type="button" data-adjust="-1" aria-label="أنقص العدد" '+(n===0?'disabled':'')+'>−</button></div><div class="lab-sheet" role="img" aria-label="عدد الطبعات '+arab(groups)+'، في كلّ طبعة '+arab(size)+' من النجوم">'+prints+'</div><div class="lab-result" role="status"><p>عدد النجوم <b>'+arab(n)+'</b></p>'+eq(groups,size,n)+'</div>';
}
function drawLab(focusOn=''){
 const box=book.querySelector('.lab-content');if(!box)return;box.innerHTML=labContents();
 book.querySelectorAll('[data-fact]').forEach(b=>{const yes=Number(b.dataset.fact)===sampleCount;b.classList.toggle('active',yes);b.setAttribute('aria-pressed',String(yes));});
 if(focusOn){const b=box.querySelector(focusOn+':not(:disabled)')||box.querySelector('[data-adjust]:not(:disabled)');if(b)b.focus({preventScroll:true});}
 fitPaper();
}
book.addEventListener('input',e=>{if(!busy&&e.target.matches('.answer-form input'))activityState(current).input=e.target.value;});
book.addEventListener('submit',e=>{if(!e.target.matches('.answer-form'))return;e.preventDefault();if(!busy){const v=e.target.querySelector('input').value;activityState(current).input=v;submitAnswer(current,numericInput(v));}});
book.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||busy)return;
 if(current===last){
  if(b.hasAttribute('data-adjust')){sampleCount=Math.min(10,Math.max(0,sampleCount+Number(b.dataset.adjust)));drawLab('[data-adjust="'+b.dataset.adjust+'"]');}
  else if(b.hasAttribute('data-fact')){sampleCount=Number(b.dataset.fact);drawLab();}
  else if(b.hasAttribute('data-mode')){batchMode=b.dataset.mode==='batch';drawLab('[data-mode="'+b.dataset.mode+'"]');}
  return;
 }
 const t=spreads[current].task;if(!t)return;const st=activityState(current);
 if(b.hasAttribute('data-stamp'))pressStamp(current);
 else if(b.hasAttribute('data-choice')&&!st.correct){st.choice=Number(b.dataset.choice);submitAnswer(current,st.choice);}
 else if(b.hasAttribute('data-retry')){progress.delete(current);refreshActivity(current,true,t.mode==='choice'?'.option':t.stamp?'[data-stamp]':'.answer-form input');}
});

function textPage(i){
 const s=spreads[i];
 if(i===0)return makePage('right','paper','<div class="cover-inner"><svg class="crest" aria-hidden="true"><use href="#i-crest"/></svg><h1 class="cover-title">لَوْزَة<span>وخَتْمُ القَمَر</span></h1><div class="cover-sub">حكايةٌ في جدول الضرب في ١</div><div class="cover-meta">'+icon('book')+'للصفّ الثالث الابتدائي</div></div>',nameOfBook);
 if(i===last)return tablePage();
 const trail=s.trail?'<div class="trail" aria-label="العدّ بالقفز">'+s.trail.map(n=>'<span>'+arab(n)+'</span>').join('')+'</div>':'';
 const eqs=s.eq?'<div class="eqs">'+s.eq.map(v=>eq(...v)).join('')+'</div>':'';
 const ps=s.paras.map(p=>'<p'+(p.startsWith('«')?' class="quote"':'')+'>'+p+'</p>').join('');
 return makePage('right','paper','<div class="story-box"><div class="scene">'+s.scene+'</div><h2>'+s.title+'</h2>'+ps+trail+(s.after?'<p>'+s.after+'</p>':'')+eqs+(s.task?questionBox(i):'')+(s.question?'<div class="question">'+s.question+'</div>':'')+'</div>'+folio(2*i-1),s.title);
}
function artPage(i){
 if(i===last)return labPage();
 const s=spreads[i],hasBoard=Boolean(s.task&&s.task.stamp);
 return makePage('left','art'+(i===0?' cover-art':'')+(hasBoard?' has-board':''),'<img draggable="false" src="'+art[s.art]+'" alt="'+s.alt+'">'+(hasBoard?stampBoard(i):'')+(i?folio(2*i,true):''),'رسم '+s.title);
}
function tablePage(){
 const rows=Array.from({length:11},(_,k)=>'<li><button type="button" data-fact="'+k+'" aria-label="اختر العدد '+arab(k)+'" aria-pressed="'+(k===sampleCount)+'" class="fact '+(k===sampleCount?'active':'')+'">'+eq(k,1,k)+'</button></li>').join('');
 return makePage('right','paper','<div class="table-page"><h2>جدول الضرب في ١</h2><p class="tagline">اختر عددًا من الجدول وجرّب خَتْمه في المطبعة.</p><ul>'+rows+'</ul><p class="table-foot">كلّ عددٍ نضربُه في ١ يعطينا العدد نفسه.</p></div>'+folio(2*last-1),'جدول الضرب في واحد');
}
function labPage(){
 return makePage('left','paper lab-paper','<div class="table-page lab-page"><h2>مطبعة النجوم</h2><p class="tagline">بدّل بين الخَتْمين ولاحِظ عدد النجوم.</p><div class="lab-content">'+labContents()+'</div></div>'+folio(2*last),'مطبعة النجوم');
}

function getPair(i){return [textPage(i),artPage(i)];}
function clearBase(){book.querySelectorAll(':scope > .page').forEach(e=>e.remove());single.replaceChildren();}
function cancelTurn(){version++;if(activeMotion){activeMotion.cancel();activeMotion=null;}if(activeLeaf){activeLeaf.remove();activeLeaf=null;}busy=false;}
function fitPaper(){
 if(compact||busy)return;
 book.style.removeProperty('--fit');
 const boxes=book.querySelectorAll(':scope > .page .story-box,:scope > .page .table-page');
 const height=Math.max(0,...Array.from(boxes,b=>b.scrollHeight));
 if(height>book.clientHeight)book.style.setProperty('--fit',height+'px');
}
function draw(){
 clearBase();
 const [right,left]=getPair(current);
 if(compact){single.append(...(current===last?[right,left]:[left,right]));}
 else{book.prepend(right,left);}
 document.querySelector('.frame').dataset.spread=String(current);
 byId('prev').disabled=current===0;
 byId('next').querySelector('span').textContent=current===0?'افتح الكتاب':current===last?'من البداية':current===last-1?'إلى مطبعة النجوم':'التّالي';
 byId('status').textContent=pageRange(current);
 byId('dots').innerHTML=spreads.map((_,i)=>'<i class="'+(i===current?'on':'')+'"></i>').join('');
 if(spreads[current].task)refreshActivity(current);else fitPaper();
 for(const [i,btn] of [...byId('chapters').children].entries())btn.setAttribute('aria-current',String(current===i));
}
function layoutBook(){
 cancelTurn();compact=layoutPreference===null?narrow.matches:layoutPreference==='single';
 document.body.classList.toggle('compact',compact);document.body.classList.toggle('double-small',!compact&&narrow.matches);
 const label=compact?'عرض صفحتين':'عرض صفحة واحدة';const button=byId('layout');button.title=label;button.setAttribute('aria-label',label);button.querySelector('span').textContent=label;draw();
}
function turnTo(dest){
 if(busy||dest<0||dest>last||dest===current)return;
 if(reduceMotion.matches){current=dest;draw();return;}
 busy=true;const token=++version,forward=dest>current;
 const finish=()=>{if(token!==version)return;current=dest;cancelTurn();draw();};
 if(compact){
  if(!single.animate){finish();return;}
  const dir=forward?1:-1;single.style.transformOrigin=forward?'right center':'left center';
  activeMotion=single.animate([{transform:'rotateY(0deg)',opacity:1},{transform:'rotateY('+dir*76+'deg)',opacity:.4}],{duration:220,easing:'ease-in',fill:'forwards'});
  activeMotion.onfinish=()=>{if(token!==version)return;activeMotion.cancel();current=dest;draw();
   if(document.documentElement.scrollTop>80)document.querySelector('.frame').scrollIntoView({block:'start',behavior:'instant'});
   single.style.transformOrigin=forward?'left center':'right center';
   activeMotion=single.animate([{transform:'rotateY('+(-dir*76)+'deg)',opacity:.4},{transform:'rotateY(0)',opacity:1}],{duration:250,easing:'ease-out'});
   activeMotion.onfinish=finish;
  };return;
 }
 const [oldR,oldL]=getPair(current),[newR,newL]=getPair(dest);
 clearBase();book.prepend(forward?oldR:newR,forward?newL:oldL);
 const leaf=document.createElement('div');leaf.inert=true;leaf.className='leaf '+(forward?'forward':'backward');leaf.setAttribute('aria-hidden','true');
 const front=document.createElement('div'),back=document.createElement('div');front.className='leaf-face front';back.className='leaf-face back';
 front.append(forward?oldL:oldR);back.append(forward?newR:newL);leaf.append(front,back);
 activeLeaf=leaf;leaf.addEventListener('animationend',e=>{if(e.target===leaf)finish();});book.append(leaf);book.querySelectorAll(':scope > .page').forEach(p=>p.inert=true);
 window.setTimeout(finish,950);
}
byId('prev').onclick=()=>turnTo(current-1);byId('next').onclick=()=>{if(current===last&&!busy){progress.clear();sampleCount=3;batchMode=false;}turnTo(current===last?0:current+1);};
byId('layout').onclick=()=>{layoutPreference=compact?'double':'single';layoutBook();};
narrow.addEventListener('change',()=>{layoutPreference=null;layoutBook();});
byId('chapters').replaceChildren(...spreads.map((s,i)=>{const b=document.createElement('button');b.type='button';b.innerHTML='<span>'+s.title+'</span><small>'+ (i?pageRange(i):'بداية الكتاب')+'</small>';b.onclick=()=>{dialog.close();turnTo(i);};return b;}));
byId('open-index').onclick=()=>dialog.showModal();
byId('close-index').onclick=()=>dialog.close();dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}});
const expand=byId('expand');
if(!document.documentElement.requestFullscreen||!document.fullscreenEnabled)expand.hidden=true;
expand.onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{expand.hidden=true;}};
document.addEventListener('fullscreenchange',()=>{const str=document.fullscreenElement?'خروج من ملء الشاشة':'ملء الشاشة';expand.title=str;expand.setAttribute('aria-label',str);expand.querySelector('span').textContent=str;});
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select')||dialog.open||e.ctrlKey||e.metaKey||e.altKey)return;const move={ArrowLeft:current+1,ArrowRight:current-1,Home:0,End:last}[e.key];if(move!==undefined){e.preventDefault();turnTo(move);}});
let start=null;book.addEventListener('pointerdown',e=>{if(e.target.closest('button,input,form,.stamp-board,.activity,.lab-page')||!e.isPrimary||e.button!==0){start=null;return;}start={x:e.clientX,y:e.clientY};});
book.addEventListener('pointercancel',()=>{start=null;});
book.addEventListener('pointerup',e=>{if(!start)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;start=null;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.4)turnTo(current+(dx>0?1:-1));else if(!compact&&Math.abs(dx)<7&&Math.abs(dy)<7){const r=book.getBoundingClientRect();if(e.clientY>r.top+r.height*.67){if(e.clientX<r.left+r.width*.09)turnTo(current+1);else if(e.clientX>r.right-r.width*.09)turnTo(current-1);}}});
layoutBook();
document.fonts.ready.then(fitPaper);
window.addEventListener('resize',fitPaper);
</script></body></html>
